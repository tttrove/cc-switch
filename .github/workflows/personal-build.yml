name: Personal Windows Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或提交（默认 main）"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = '{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --bundles msi --config $config
          pnpm tauri build --bundles nsis --config $config

      - name: Upload installers and executable
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/cc-switch.exe
